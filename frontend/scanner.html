<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Scanner - Malware Analysis</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-shield-virus"></i></div>
            <span>Aegis</span>
        </div>
        <ul class="nav-links">
            <li><a href="/" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="/scanner.html" class="nav-item active"><i class="fa-solid fa-microscope"></i> File Scanner</a></li>
            <li><a href="/ioc.html" class="nav-item"><i class="fa-solid fa-network-wired"></i> IoC Detection</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="topbar">
            <h1 class="page-title">File Scanner</h1>
        </header>

        <section class="panel" style="max-width: 800px; margin: 0 auto;">
            <div class="panel-header">
                <h2 class="panel-title">Upload Suspicious File</h2>
            </div>
            
            <div class="dropzone" id="dropzone">
                <i class="fa-solid fa-cloud-arrow-up dropzone-icon"></i>
                <h3 class="dropzone-title">Drag & Drop File Here</h3>
                <p class="dropzone-desc">or click to browse from your computer</p>
                <input type="file" id="file-input" class="file-input-hidden">
                <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
                    <i class="fa-solid fa-folder-open"></i> Select File
                </button>
            </div>

            <div class="scanner-progress" id="scanner-progress">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span id="scan-status-text" class="progress-text">Uploading file...</span>
                    <span id="scan-percent" class="progress-text">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div id="scan-error" style="display: none; margin-top: 1.5rem; color: var(--accent-red); background: rgba(239,68,68,0.1); padding: 1rem; border-radius: 8px; border: 1px solid rgba(239,68,68,0.3);">
                <i class="fa-solid fa-triangle-exclamation"></i> <span id="scan-error-msg">Error occurred during scan.</span>
            </div>
        </section>
    </main>

    <script src="/js/app.js"></script>
    <script src="/js/scanner.js"></script>
</body>
</html>
